plugins { id 'fabric-loom' version '1.8.13' }
group = rootProject.group
version = rootProject.version
base { archivesName = 'shirokai_daily' }
repositories { mavenCentral(); maven { url = 'https://artefacts.cobblemon.com/releases' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.20.1'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
 modCompileOnly('com.cobblemon:fabric:1.8.3+1.21.1') { transitive = false }
 compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
 implementation project(':')
 include project(':')
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

// Runtime dependencies are explicit; user-provided optional mods are never redistributed in our JAR.
if (providers.gradleProperty('integrationRuntime').isPresent()) {
 dependencies {
  modRuntimeOnly('com.cobblemon:fabric:1.8.3+1.21.1') { transitive = false }
  modRuntimeOnly 'net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20'
 }
}
['impactorJar', 'cratesJar', 'luckpermsJar'].each { name ->
 if (providers.gradleProperty(name).isPresent()) {
  dependencies { modRuntimeOnly files(providers.gradleProperty(name).get()) }
 }
}
tasks.named('sourcesJar', Jar) { exclude 'fabric.mod.json' }
